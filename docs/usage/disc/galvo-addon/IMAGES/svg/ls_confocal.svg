<text x='20.0' y='262.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal'>Light from the focus converges to the pinhole and passes; light from other depths is spread over the pinhole plane and mostly blocked.</text>
<text x='20.0' y='282.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#444' text-anchor='start' font-weight='normal'>In the FLIM add-on the emission returns through the galvo (descanned), so the detection fibre stays fixed while the spot scans.</text>
