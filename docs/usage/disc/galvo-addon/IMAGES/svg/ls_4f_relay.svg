<text x='20.0' y='368.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#444' text-anchor='start' font-weight='normal'>Galvo and BFP are conjugate: the beam pivots there and does not walk. Intermediate image and sample are conjugate: the spot moves there.</text>
<text x='20.0' y='384.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#444' text-anchor='start' font-weight='normal'>θ_galvo is the optical angle, twice the mirror's mechanical angle.</text>
