<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- staircase: each step a box, higher = more of the lab automated -->
  <rect x="30" y="250" width="176" height="120" rx="6" fill="#e9f2fa" stroke="#1f6fb2" stroke-width="2"/>
  <text x="118" y="276" font-size="15" text-anchor="middle" fill="#123d63" font-weight="bold">1 · Device</text>
  <text x="118" y="300" font-size="12" text-anchor="middle" fill="#333">stage, camera, light,</text>
  <text x="118" y="318" font-size="12" text-anchor="middle" fill="#333">objectives as SiLA</text>
  <text x="118" y="336" font-size="12" text-anchor="middle" fill="#333">commands with units</text>
  <text x="118" y="354" font-size="12" text-anchor="middle" fill="#333">and defined errors</text>

  <rect x="222" y="200" width="176" height="170" rx="6" fill="#e9f2fa" stroke="#1f6fb2" stroke-width="2"/>
  <text x="310" y="226" font-size="15" text-anchor="middle" fill="#123d63" font-weight="bold">2 · Workcell</text>
  <text x="310" y="250" font-size="12" text-anchor="middle" fill="#333">robot hand-over,</text>
  <text x="310" y="268" font-size="12" text-anchor="middle" fill="#333">lock against the UI,</text>
  <text x="310" y="286" font-size="12" text-anchor="middle" fill="#333">taught positions</text>
  <text x="310" y="304" font-size="12" text-anchor="middle" fill="#333">that survive restarts</text>

  <rect x="414" y="150" width="176" height="220" rx="6" fill="#e9f2fa" stroke="#1f6fb2" stroke-width="2"/>
  <text x="502" y="176" font-size="15" text-anchor="middle" fill="#123d63" font-weight="bold">3 · Workflow</text>
  <text x="502" y="200" font-size="12" text-anchor="middle" fill="#333">saved ImSwitch jobs</text>
  <text x="502" y="218" font-size="12" text-anchor="middle" fill="#333">become workflow steps;</text>
  <text x="502" y="236" font-size="12" text-anchor="middle" fill="#333">the scheduler runs the</text>
  <text x="502" y="254" font-size="12" text-anchor="middle" fill="#333">lab, the microscope</text>
  <text x="502" y="272" font-size="12" text-anchor="middle" fill="#333">is one station</text>

  <rect x="606" y="100" width="176" height="270" rx="6" fill="#ffffff" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="694" y="126" font-size="15" text-anchor="middle" fill="#123d63" font-weight="bold">4 · Intent</text>
  <text x="694" y="150" font-size="12" text-anchor="middle" fill="#333">an AI agent turns</text>
  <text x="694" y="168" font-size="12" text-anchor="middle" fill="#333">"image every well with</text>
  <text x="694" y="186" font-size="12" text-anchor="middle" fill="#333">cells after 24 h" into</text>
  <text x="694" y="204" font-size="12" text-anchor="middle" fill="#333">workflow steps on the</text>
  <text x="694" y="222" font-size="12" text-anchor="middle" fill="#333">workcell layer</text>

  <rect x="798" y="50" width="176" height="320" rx="6" fill="#ffffff" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="886" y="76" font-size="15" text-anchor="middle" fill="#123d63" font-weight="bold">5 · Closed loop</text>
  <text x="886" y="100" font-size="12" text-anchor="middle" fill="#333">analysis on the</text>
  <text x="886" y="118" font-size="12" text-anchor="middle" fill="#333">microscope (counts,</text>
  <text x="886" y="136" font-size="12" text-anchor="middle" fill="#333">focus, regions) decides</text>
  <text x="886" y="154" font-size="12" text-anchor="middle" fill="#333">the next step: re-image,</text>
  <text x="886" y="172" font-size="12" text-anchor="middle" fill="#333">dose, move on</text>

  <!-- legend -->
  <rect x="30" y="40" width="22" height="14" fill="#e9f2fa" stroke="#1f6fb2" stroke-width="2"/>
  <text x="60" y="52" font-size="13" fill="#333">available in ImSwitch</text>
  <rect x="30" y="66" width="22" height="14" fill="#fff" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="60" y="78" font-size="13" fill="#333">where it is going</text>
  <line x1="30" y1="390" x2="974" y2="390" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
</svg>
