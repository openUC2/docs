<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- layer labels -->
  <text x="24" y="58" font-size="13" fill="#666" font-weight="bold">WORKFLOW</text>
  <text x="24" y="76" font-size="13" fill="#666" font-weight="bold">LAYER</text>
  <text x="24" y="268" font-size="13" fill="#666" font-weight="bold">DEVICE</text>
  <text x="24" y="286" font-size="13" fill="#666" font-weight="bold">LAYER</text>
  <text x="24" y="478" font-size="13" fill="#666" font-weight="bold">INSIDE THE</text>
  <text x="24" y="496" font-size="13" fill="#666" font-weight="bold">MICROSCOPE</text>

  <!-- workflow layer -->
  <rect x="140" y="24" width="836" height="96" rx="6" fill="#f4f4f4" stroke="#999"/>
  <rect x="160" y="42" width="250" height="60" rx="4" fill="#fff" stroke="#666"/>
  <text x="285" y="68" font-size="15" text-anchor="middle" fill="#222">Scheduler / workflow engine</text>
  <text x="285" y="88" font-size="12" text-anchor="middle" fill="#666">plans steps, moves plates</text>
  <rect x="432" y="42" width="250" height="60" rx="4" fill="#fff" stroke="#666"/>
  <text x="557" y="68" font-size="15" text-anchor="middle" fill="#222">AI agents</text>
  <text x="557" y="88" font-size="12" text-anchor="middle" fill="#666">scientific intent → workflow</text>
  <rect x="704" y="42" width="250" height="60" rx="4" fill="#fff" stroke="#666"/>
  <text x="829" y="68" font-size="15" text-anchor="middle" fill="#222">Inventory, samples, data</text>
  <text x="829" y="88" font-size="12" text-anchor="middle" fill="#666">LIMS, registry, results</text>

  <!-- SiLA bus -->
  <line x1="140" y1="176" x2="976" y2="176" stroke="#444" stroke-width="2"/>
  <text x="558" y="166" font-size="13" text-anchor="middle" fill="#333">SiLA 2 over gRPC · discovery by mDNS · Lock Controller · plate hand-over</text>
  <line x1="955" y1="120" x2="955" y2="174" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="230" y1="178" x2="230" y2="226" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="438" y1="178" x2="438" y2="226" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="646" y1="178" x2="646" y2="226" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="862" y1="178" x2="862" y2="226" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- device layer -->
  <rect x="150" y="228" width="160" height="80" rx="4" fill="#fff" stroke="#666"/>
  <text x="230" y="264" font-size="15" text-anchor="middle" fill="#222">Incubator</text>
  <text x="230" y="284" font-size="12" text-anchor="middle" fill="#666">plate hotel</text>
  <rect x="358" y="228" width="160" height="80" rx="4" fill="#fff" stroke="#666"/>
  <text x="438" y="264" font-size="15" text-anchor="middle" fill="#222">Robot arm</text>
  <text x="438" y="284" font-size="12" text-anchor="middle" fill="#666">active hand-over side</text>
  <rect x="566" y="228" width="160" height="80" rx="4" fill="#fff" stroke="#666"/>
  <text x="646" y="264" font-size="15" text-anchor="middle" fill="#222">Liquid handler</text>
  <text x="646" y="284" font-size="12" text-anchor="middle" fill="#666">dispenser, reader …</text>
  <rect x="774" y="228" width="176" height="80" rx="4" fill="#e9f2fa" stroke="#1f6fb2" stroke-width="2"/>
  <text x="862" y="262" font-size="15" text-anchor="middle" fill="#123d63" font-weight="bold">openUC2 FRAME</text>
  <text x="862" y="284" font-size="12" text-anchor="middle" fill="#123d63">microscope (passive side)</text>

  <!-- zoom into FRAME -->
  <path d="M774,308 L140,370 M950,308 L976,370" stroke="#1f6fb2" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  <rect x="140" y="370" width="836" height="250" rx="6" fill="#f7fafd" stroke="#1f6fb2"/>

  <rect x="160" y="392" width="250" height="96" rx="4" fill="#fff" stroke="#1f6fb2"/>
  <text x="285" y="416" font-size="15" text-anchor="middle" fill="#123d63" font-weight="bold">SiLA 2 server</text>
  <text x="285" y="438" font-size="12" text-anchor="middle" fill="#333">Stage · Imaging · Experiment</text>
  <text x="285" y="456" font-size="12" text-anchor="middle" fill="#333">Jobs · Labware transfer site</text>
  <text x="285" y="474" font-size="12" text-anchor="middle" fill="#333">Lock</text>

  <rect x="160" y="508" width="250" height="92" rx="4" fill="#fff" stroke="#666"/>
  <text x="285" y="532" font-size="15" text-anchor="middle" fill="#222">ImSwitch UI / HTTP API</text>
  <text x="285" y="554" font-size="12" text-anchor="middle" fill="#333">operator, scripts</text>
  <text x="285" y="574" font-size="12" text-anchor="middle" fill="#b23a1f">while locked: read and stop only</text>

  <line x1="410" y1="440" x2="480" y2="496" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="554" x2="480" y2="510" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="482" y="430" width="230" height="140" rx="4" fill="#fff" stroke="#666"/>
  <text x="597" y="456" font-size="15" text-anchor="middle" fill="#222">ImSwitch controllers</text>
  <text x="597" y="480" font-size="12" text-anchor="middle" fill="#333">travel limits, busy checks</text>
  <text x="597" y="500" font-size="12" text-anchor="middle" fill="#333">autofocus, well-plate scans</text>
  <text x="597" y="520" font-size="12" text-anchor="middle" fill="#333">Aufgaben jobs</text>
  <text x="597" y="540" font-size="12" text-anchor="middle" fill="#333">OME-Zarr / OME-TIFF</text>

  <line x1="712" y1="500" x2="760" y2="500" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="762" y="430" width="194" height="140" rx="4" fill="#fff" stroke="#666"/>
  <text x="859" y="456" font-size="15" text-anchor="middle" fill="#222">Hardware</text>
  <text x="859" y="480" font-size="12" text-anchor="middle" fill="#333">UC2 electronics (CAN)</text>
  <text x="859" y="500" font-size="12" text-anchor="middle" fill="#333">stage, focus, turret</text>
  <text x="859" y="520" font-size="12" text-anchor="middle" fill="#333">LEDs, lasers</text>
  <text x="859" y="540" font-size="12" text-anchor="middle" fill="#333">camera</text>
</svg>
