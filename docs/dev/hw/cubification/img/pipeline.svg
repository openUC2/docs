<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 330" width="1030" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img">
<title>From an optical design file to parts in cubes: seven steps</title>
<desc>Read the file, rebuild and check the optics, sort the gaps, fit to the grid, pick holders, generate parts, assemble and check.</desc>
<defs>
  <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  <marker id="ah-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e8e4a"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d9dde2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9aa3ad" stroke-width="1.6"/></pattern>
</defs>
<rect width="1030" height="330" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="600">From a design file to parts in cubes</text>
<text x="20.0" y="52.0" font-size="12.5" fill="#6b7280" text-anchor="start">Each step is a script; the numbers are those of the OpenRAMAN port.</text>
<rect x="20.0" y="74.0" width="124.0" height="76.0" rx="8" fill="#eef3fa" stroke="#3b6ea5" stroke-width="1.3"/>
<circle cx="36.0" cy="91.0" r="10.5" fill="#3b6ea5" stroke="none" stroke-width="1.0"/>
<text x="36.0" y="95.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="53.0" y="96.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Read the file</text>
<text x="26.0" y="170.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">raman_zmx.py</text>
<text x="26.0" y="190.0" font-size="11.5" fill="#6b7280" text-anchor="start">57 surfaces,</text>
<text x="26.0" y="205.0" font-size="11.5" fill="#6b7280" text-anchor="start">elements with poses</text>
<line x1="145.0" y1="112.0" x2="158.0" y2="112.0" stroke="#1f2328" stroke-width="1.4" marker-end="url(#ah-k)"/>
<rect x="160.0" y="74.0" width="124.0" height="76.0" rx="8" fill="#eef3fa" stroke="#3b6ea5" stroke-width="1.3"/>
<circle cx="176.0" cy="91.0" r="10.5" fill="#3b6ea5" stroke="none" stroke-width="1.0"/>
<text x="176.0" y="95.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="193.0" y="94.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Rebuild and</text>
<text x="193.0" y="110.2" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">check the optics</text>
<text x="166.0" y="170.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">raman_optics.py</text>
<text x="166.0" y="190.0" font-size="11.5" fill="#6b7280" text-anchor="start">29 checks against</text>
<text x="166.0" y="205.0" font-size="11.5" fill="#6b7280" text-anchor="start">the Zemax file</text>
<line x1="285.0" y1="112.0" x2="298.0" y2="112.0" stroke="#1f2328" stroke-width="1.4" marker-end="url(#ah-k)"/>
<rect x="300.0" y="74.0" width="124.0" height="76.0" rx="8" fill="#fdf3df" stroke="#b0791c" stroke-width="1.3"/>
<circle cx="316.0" cy="91.0" r="10.5" fill="#b0791c" stroke="none" stroke-width="1.0"/>
<text x="316.0" y="95.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="333.0" y="94.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Sort the gaps:</text>
<text x="333.0" y="110.2" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">free or locked</text>
<text x="306.0" y="170.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">fit_to_grid.py</text>
<text x="306.0" y="190.0" font-size="11.5" fill="#6b7280" text-anchor="start">6 free, 3 locked</text>
<text x="306.0" y="205.0" font-size="11.5" fill="#6b7280" text-anchor="start">(ray tracing)</text>
<line x1="425.0" y1="112.0" x2="438.0" y2="112.0" stroke="#1f2328" stroke-width="1.4" marker-end="url(#ah-k)"/>
<rect x="440.0" y="74.0" width="124.0" height="76.0" rx="8" fill="#fdf3df" stroke="#b0791c" stroke-width="1.3"/>
<circle cx="456.0" cy="91.0" r="10.5" fill="#b0791c" stroke="none" stroke-width="1.0"/>
<text x="456.0" y="95.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="600">4</text>
<text x="473.0" y="96.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Fit to the grid</text>
<text x="446.0" y="170.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">fit_to_grid.py</text>
<text x="446.0" y="184.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">raman_layout.py</text>
<text x="446.0" y="204.0" font-size="11.5" fill="#6b7280" text-anchor="start">cells, joint planes,</text>
<text x="446.0" y="219.0" font-size="11.5" fill="#6b7280" text-anchor="start">26 layout checks</text>
<line x1="565.0" y1="112.0" x2="578.0" y2="112.0" stroke="#1f2328" stroke-width="1.4" marker-end="url(#ah-k)"/>
<rect x="580.0" y="74.0" width="124.0" height="76.0" rx="8" fill="#fdf3df" stroke="#b0791c" stroke-width="1.3"/>
<circle cx="596.0" cy="91.0" r="10.5" fill="#b0791c" stroke="none" stroke-width="1.0"/>
<text x="596.0" y="95.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="600">5</text>
<text x="613.0" y="94.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Pick a holder</text>
<text x="613.0" y="110.2" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">per element</text>
<text x="586.0" y="170.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">fit_to_grid.py</text>
<text x="586.0" y="190.0" font-size="11.5" fill="#6b7280" text-anchor="start">rule table,</text>
<text x="586.0" y="205.0" font-size="11.5" fill="#6b7280" text-anchor="start">13 elements</text>
<line x1="705.0" y1="112.0" x2="718.0" y2="112.0" stroke="#1f2328" stroke-width="1.4" marker-end="url(#ah-k)"/>
<rect x="720.0" y="74.0" width="124.0" height="76.0" rx="8" fill="#eef3fa" stroke="#3b6ea5" stroke-width="1.3"/>
<circle cx="736.0" cy="91.0" r="10.5" fill="#3b6ea5" stroke="none" stroke-width="1.0"/>
<text x="736.0" y="95.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="600">6</text>
<text x="753.0" y="94.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Generate</text>
<text x="753.0" y="110.2" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">the parts</text>
<text x="726.0" y="170.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">raman_holders.py</text>
<text x="726.0" y="190.0" font-size="11.5" fill="#6b7280" text-anchor="start">16 to 18 STEP files</text>
<text x="726.0" y="205.0" font-size="11.5" fill="#6b7280" text-anchor="start">per layout</text>
<line x1="845.0" y1="112.0" x2="858.0" y2="112.0" stroke="#1f2328" stroke-width="1.4" marker-end="url(#ah-k)"/>
<rect x="860.0" y="74.0" width="124.0" height="76.0" rx="8" fill="#eef3fa" stroke="#3b6ea5" stroke-width="1.3"/>
<circle cx="876.0" cy="91.0" r="10.5" fill="#3b6ea5" stroke="none" stroke-width="1.0"/>
<text x="876.0" y="95.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="600">7</text>
<text x="893.0" y="94.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Assemble</text>
<text x="893.0" y="110.2" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">and check</text>
<text x="866.0" y="170.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">build_raman_assembly.py</text>
<text x="866.0" y="184.0" font-size="10.6" fill="#1f2328" text-anchor="start" font-family="Consolas, Menlo, monospace">check_raman_assembly.py</text>
<text x="866.0" y="204.0" font-size="11.5" fill="#6b7280" text-anchor="start">Inventor assembly,</text>
<text x="866.0" y="219.0" font-size="11.5" fill="#6b7280" text-anchor="start">53 checks</text>
<path d="M922.0,242.0 L922.0,262.0 L510.0,262.0 L510.0,242.0" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ah-g)"/>
<text x="712.0" y="278.0" font-size="11.5" fill="#6b7280" text-anchor="middle">a failed check changes a distance in step 4, never a part by hand</text>
<path d="M494.0,242.0 L494.0,262.0 L222.0,262.0 L222.0,242.0" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ah-g)"/>
<text x="358.0" y="278.0" font-size="11.5" fill="#6b7280" text-anchor="middle">the new distances go back through the optics checks (20)</text>
<rect x="20.0" y="304.0" width="14.0" height="12.0" rx="0.0" fill="#fdf3df" stroke="#b0791c" stroke-width="1.0"/>
<text x="40.0" y="314.0" font-size="11.5" fill="#6b7280" text-anchor="start">steps 3 to 5 were hand work in round 1; fit_to_grid.py now does them as a search</text>
</svg>
