<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img">
<title>Why a 47.5 degree arm cannot start inside a cube</title>
<desc>Left: a cube from above with its four corner posts and the directions a beam can leave in. Right: the grating outside the cube, on a plate.</desc>
<defs>
  <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
