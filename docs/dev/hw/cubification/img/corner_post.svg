<text x="24.0" y="538.0" font-size="12" fill="#1f2328" text-anchor="start">From the cube centre a thin beam passes up to 34° from a face normal,</text>
<text x="24.0" y="556.0" font-size="12" fill="#1f2328" text-anchor="start">a 3 mm beam up to 31°, the 16.9 mm beam behind the collimator up to 18°.</text>
<text x="24.0" y="574.0" font-size="12" fill="#1f2328" text-anchor="start">Anything steeper has to start outside the cubes.</text>
