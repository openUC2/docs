<text x="292.0" y="633.2" font-size="11.5" fill="#1f2328" text-anchor="middle">cube 49.8 mm (pitch 50.1); beyond ± 21 mm only parts thinner than 34 mm</text>
<rect x="566.0" y="121.0" width="18.0" height="14.0" rx="0.0" fill="url(#hatch)" stroke="#4b5057" stroke-width="1.0"/>
<text x="592.0" y="132.0" font-size="12" fill="#1f2328" text-anchor="start">cube: end frames</text>
<rect x="566.0" y="145.0" width="18.0" height="14.0" rx="0.0" fill="#a9aeb6" stroke="#4b5057" stroke-width="1.0"/>
<text x="592.0" y="156.0" font-size="12" fill="#1f2328" text-anchor="start">master insert, 4 mm, moulded</text>
<rect x="566.0" y="169.0" width="18.0" height="14.0" rx="0.0" fill="#f6c98a" stroke="#b0791c" stroke-width="1.0"/>
<text x="592.0" y="180.0" font-size="12" fill="#1f2328" text-anchor="start">printed cartridge, two halves split at the joint</text>
<rect x="566.0" y="193.0" width="18.0" height="14.0" rx="0.0" fill="#8fd5ec" stroke="#0d6f8c" stroke-width="1.0"/>
<text x="592.0" y="204.0" font-size="12" fill="#1f2328" text-anchor="start">optic: focusing lens 12.7 mm, slit disc 25.4 mm</text>
<rect x="566.0" y="217.0" width="18.0" height="14.0" rx="0.0" fill="#bfe8c9" stroke="#7cc391" stroke-width="1.0"/>
<text x="592.0" y="228.0" font-size="12" fill="#1f2328" text-anchor="start">beam at the aperture limit (NA 0.17)</text>
<text x="566.0" y="274.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">What follows</text>
<text x="566.0" y="296.0" font-size="12" fill="#1f2328" text-anchor="start">1  An optic sits between two master inserts. One of</text>
<text x="566.0" y="314.0" font-size="12" fill="#1f2328" text-anchor="start">    them has its mid-plane on a notch, so the joint</text>
<text x="566.0" y="332.0" font-size="12" fill="#1f2328" text-anchor="start">    plane is 2 mm beside a notch. With both inserts</text>
<text x="566.0" y="350.0" font-size="12" fill="#1f2328" text-anchor="start">    inside ± 17 mm the joint lies between −13 and +13.</text>
<text x="566.0" y="368.0" font-size="12" fill="#1f2328" text-anchor="start">2  The optic's centre may be up to 4 mm from the</text>
<text x="566.0" y="386.0" font-size="12" fill="#1f2328" text-anchor="start">    joint; the printed halves take up the difference.</text>
<text x="566.0" y="404.0" font-size="12" fill="#1f2328" text-anchor="start">3  Between 17 mm and the face nothing with the full</text>
<text x="566.0" y="422.0" font-size="12" fill="#1f2328" text-anchor="start">    outline fits: 16 mm are lost at every cube boundary.</text>
<text x="566.0" y="440.0" font-size="12" fill="#1f2328" text-anchor="start">4  Two sandwiches share a cube when the printed</text>
<text x="566.0" y="458.0" font-size="12" fill="#1f2328" text-anchor="start">    parts do not touch (here 10.6 mm apart).</text>
</svg>
