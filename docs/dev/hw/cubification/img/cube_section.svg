<text x="292.0" y="565.2" font-size="11.5" fill="#1f2328" text-anchor="middle">± 17 mm: inserts with the full outline</text>
<line x1="143.2" y1="605.2" x2="440.8" y2="605.2" stroke="#1f2328" stroke-width="1.1" marker-end="url(#ah-k)" marker-start="url(#ah-k)"/>
