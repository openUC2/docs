<text x="292.0" y="599.2" font-size="11.5" fill="#1f2328" text-anchor="middle">± 18.6 mm: round printed part, radius up to 19.2 mm</text>
<line x1="92.8" y1="639.2" x2="491.2" y2="639.2" stroke="#1f2328" stroke-width="1.1" marker-end="url(#ah-k)" marker-start="url(#ah-k)"/>
